[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "news-house"
version = "0.1.0"
description = "A personal 15-minute daily news pipeline ranked by importance to one reader."
requires-python = ">=3.12"
dependencies = [
  "sqlalchemy>=2.0",
  "pydantic>=2",
  "pydantic-settings>=2",
  "feedparser>=6",
  "httpx>=0.27",
  "pyyaml>=6",
  "numpy>=1.26",
  "fastembed>=0.3",
  "trafilatura>=1.9",
  "jinja2>=3.1",
  "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-httpx", "freezegun"]

[project.scripts]
newshouse = "newshouse.cli:main"

[tool.setuptools.packages.find]
include = ["newshouse*"]

[tool.setuptools.package-data]
newshouse = ["static/*", "static/fonts/*", "templates/*", "llm/prompts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
